# Локальное S3-совместимое хранилище для разработки и учений.
#
# Заменяет собой оба боевых бакета Timeweb: media (фото объявлений и обложки
# профиля) и backups (суточные дампы). Основной docker-compose.yml не трогает —
# поднимается отдельно:
#
#   docker compose -f docker-compose.minio.yml up -d
#
# Консоль: http://localhost:9001 (minioadmin / minioadmin).
# На прод не едет и в основной стек не включается.

name: inrenta-minio

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # веб-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Разовая инициализация: создаёт бакеты и открывает media на публичное чтение.
  # Отрабатывает и завершается; повторный запуск идемпотентен.
  init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/inrenta-media &&
      mc mb --ignore-existing local/inrenta-backups &&
      mc anonymous set download local/inrenta-media &&
      echo '[init] buckets ready: inrenta-media (public read), inrenta-backups (private)'
      "

volumes:
  minio_data:

# MinIO подключается к сети основного стека, а не поднимает свою. Так до него
# достают оба потребителя, и каждый своим адресом:
#   - приложение (`pnpm dev` на хосте) — через проброшенный порт localhost:9000;
#   - контейнер `backup` — по имени сервиса, http://minio:9000.
# Сеть создаёт основной compose-файл, поэтому она здесь external.
networks:
  default:
    name: inrenta_default
    external: true
