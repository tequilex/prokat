# Имя проекта задано явно, иначе compose берёт его из имени каталога — и
# переименование папки молча создаёт новые пустые тома вместо существующих.
name: inrenta

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    depends_on: [app]

  app:
    build:
      context: .
      args:
        STORAGE_PUBLIC_BASE: ${STORAGE_PUBLIC_BASE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["sh", "/backup-entrypoint.sh"]
    depends_on: [db]

  # --- Только для локальной разработки -------------------------------------
  # Профиль `dev` не активируется сам: на проде `docker compose up -d` эти два
  # сервиса не трогает вовсе. Локально — `pnpm dev:up` (см. package.json).
  #
  # MinIO подменяет собой оба бакета Timeweb, чтобы локально можно было
  # проверить загрузку картинок и прогнать учения по бэкапу. Подробности и
  # значения для .env — в docs/testing.md.

  minio:
    image: minio/minio:latest
    profiles: ["dev"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # веб-консоль, minioadmin / minioadmin
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Разовая инициализация бакетов: отрабатывает и завершается, повторный
  # запуск идемпотентен.
  minio-init:
    image: minio/mc:latest
    profiles: ["dev"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/inrenta-media &&
      mc mb --ignore-existing local/inrenta-backups &&
      mc anonymous set download local/inrenta-media &&
      echo '[init] buckets ready: inrenta-media (public read), inrenta-backups (private)'
      "

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  minio_data:
